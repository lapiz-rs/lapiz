[package]
name = "lapiz_runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow.workspace = true
async-broadcast.workspace = true
downcast-rs.workspace = true
futures.workspace = true
iced_core.workspace = true
iced_futures.workspace = true
iced_graphics.workspace = true
iced_runtime.workspace = true
iced_wgpu.workspace = true
iced_winit.workspace = true
lapiz_runtime_derive.workspace = true
lapiz_utils.workspace = true
log.workspace = true
parking_lot.workspace = true
parse-display.workspace = true
raw-window-handle.workspace = true
rustc-hash.workspace = true
serde.workspace = true
smol.workspace = true
toml.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
