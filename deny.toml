[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode is pulled in by the pinned iced fork; no maintained replacement is available in that dependency graph yet" },
    { id = "RUSTSEC-2024-0436", reason = "the direct dependency uses pastey, but paste remains transitive through the image encoding stack" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is pulled in by wesl-quote; remove this exception when wesl-quote migrates" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pulled in by the iced font stack; remove this exception when the stack migrates" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",
    "GPL-3.0-or-later",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/443eb9/bevy", "https://github.com/443eb9/iced", "https://github.com/iced-rs/cryoglyph", "https://github.com/1Password/arboard.git"]
