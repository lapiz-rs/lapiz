name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: just setup-rust

      - run: just verify-release-tag "$GITHUB_REF_NAME"

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: just setup-rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-deps
          save-if: false

      - run: just setup-ci

      - run: just check

      - run: just test

      - run: just package desktop release

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          retention-days: 1
          if-no-files-found: error
          path: |
            target/package/*.zip
            target/package/*.tar.gz
            target/package/*.sha256
            target/package/*.debug
            target/package/*.pdb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find dist -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found" >&2
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
