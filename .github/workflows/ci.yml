name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Install pinned nightly rustfmt
        run: rustup toolchain install nightly-2026-06-16 --profile minimal --component rustfmt --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig1-dev \
            libudev-dev \
            libdbus-1-dev \
            libasound2-dev \
            libegl1-mesa-dev \
            libgbm-dev

      - name: Check formatting
        run: cargo +nightly-2026-06-16 fmt --all -- --check

      - name: Run clippy
        run: cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo +1.96.0 test --workspace --all-targets --locked
